<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solving PI — v9 prototype</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #0b0f14; --panel: #121924; --edge: #1f2b3a; --ink: #d8e2ee;
  --muted: #8296ab; --accent: #38bdf8; --good: #4ade80; --bad: #f87171; --warnbg: #3a1f1f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 1rem 1.25rem 4rem; }
header h1 { margin: .6rem 0 0; font-size: 1.7rem; letter-spacing: .02em; }
h2 { margin: 2rem 0 .6rem; font-size: 1.15rem; border-bottom: 1px solid var(--edge); padding-bottom: .3rem; }
h3 { margin: 1.2rem 0 .5rem; font-size: 1rem; }
h4 { margin: 0 0 .3rem; font-size: .9rem; color: var(--accent); }
section { margin-bottom: .5rem; }
table { border-collapse: collapse; width: 100%; margin: .5rem 0; }
th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid var(--edge); font-size: .9rem; }
input, select, button, textarea {
  background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
  border-radius: 6px; padding: .3rem .5rem; font: inherit;
}
input[type=number] { width: 5.5rem; }
input[type=text] { width: 9rem; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.solve { background: var(--accent); color: #04141f; font-weight: 700; padding: .55rem 1.6rem; font-size: 1.05rem; }
button.small { padding: .15rem .5rem; font-size: .8rem; }
label { margin-right: .9rem; }
label.mode { display: block; margin: .2rem 0; }
.muted { color: var(--muted); font-size: .85rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .7rem; margin: .7rem 0; }
.card { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: .7rem .9rem; }
.card .big { font-size: 1.25rem; font-weight: 700; margin: .1rem 0; }
.card.planet { margin: .6rem 0; }
.card.insight p { margin: .2rem 0; font-size: .88rem; }
.resrow { display: flex; gap: .5rem; align-items: center; margin: .3rem 0; flex-wrap: wrap; }
.warn { background: var(--warnbg); border: 1px solid var(--bad); border-radius: 8px; padding: .6rem .9rem; margin: .7rem 0; white-space: pre-wrap; }
.ledger td.neg { color: var(--bad); text-align: right; }
.ledger td.pos { color: var(--good); text-align: right; }
.ledger tr.total td { font-weight: 700; border-top: 2px solid var(--edge); }
textarea.template { width: 100%; font: 12px/1.45 ui-monospace, monospace; white-space: pre; }
details { margin: .6rem 0; }
summary { cursor: pointer; color: var(--accent); }
a { color: var(--accent); }
</style>
</head>
<body>
<main id="app"><noscript>Solving PI needs JavaScript.</noscript></main>
<script type="module" src="./js/ui/app.js"></script>
</body>
</html>
