<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Solving PI">
<!-- Derived from the hero logo, deliberately NOT a copy of it.

     The full mark carries six resource strata, an extractor array, a dashed
     orbital ring and a watermark pi. At 16px — which is the size that actually
     matters for a favicon — all of that collapses into a muddy dot. What
     survives at that size is: a dark disc, three bold colour arcs, and the
     letters PI.

     So this keeps the three outer strata at full opacity, drops the inner
     three and the extractor, thickens the core ring, and enlarges the type.
     Same identity, legible in a browser tab.

     Colours are literal hex, not CSS custom properties. A favicon is fetched as a
     standalone document with no page stylesheet, so CSS variables resolve to
     nothing and every shape would render black. This is the Carbon palette
     from 01-tokens.css; if those tokens change, this file needs the same
     change by hand — there is no build step that can do it for us. -->
<rect width="160" height="160" rx="34" fill="#05060a"/>
<circle cx="80" cy="80" r="58" fill="#0e1117"/>

<!-- Three strata, full opacity so they hold up when scaled down. -->
<path d="M81.5 22 A58 58 0 0 1 118.4 125.5 L112.2 118.4 A48.6 48.6 0 0 0 81.3 31.4 Z" fill="#22e8ff"/>
<path d="M116.1 127.4 A58 58 0 0 1 26.0 103.3 L34.8 99.8 A48.6 48.6 0 0 0 110.2 120.0 Z" fill="#ff93e0"/>
<path d="M25.0 100.6 A58 58 0 0 1 78.5 24.2 L78.7 33.6 A48.6 48.6 0 0 0 34.0 97.5 Z" fill="#ffc233"/>

<!-- Core. Larger and higher-contrast than the hero version so the letters
     still read once the whole thing is 16 pixels across. -->
<circle cx="80" cy="80" r="34" fill="#05060a"/>
<circle cx="80" cy="80" r="34" fill="none" stroke="#22e8ff" stroke-width="3" opacity=".75"/>
<text x="80" y="94" text-anchor="middle" font-family="Rajdhani,Segoe UI,system-ui,sans-serif"
      font-size="42" font-weight="700" letter-spacing="1" fill="#ffffff">PI</text>
</svg>
